<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shadikin Bhai 💘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Dancing+Script:wght@700&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--pink:#ff2d78;--purple:#b400ff;--cyan:#00f0ff;--gold:#ffd700;--dark:#07070e;--card:#111120}
    html,body{width:100%;height:100%;background:var(--dark);font-family:'Rajdhani',sans-serif;overflow:hidden}

    /* ── shared bg ── */
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .grid{position:fixed;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(rgba(180,0,255,.04) 1px,transparent 1px),
                 linear-gradient(90deg,rgba(180,0,255,.04) 1px,transparent 1px);
      background-size:44px 44px}
    .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
      background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.7) 100%)}
    .scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px)}
    #floaters{position:fixed;inset:0;pointer-events:none;z-index:3}

    /* ── pages ── */
    .page{position:fixed;inset:0;transition:opacity .55s,transform .55s}
    .page.hidden{opacity:0;pointer-events:none;transform:scale(.93)}
    .page.visible{opacity:1;pointer-events:all;transform:scale(1)}

    /* ══════════════════════
       PAGE 1
    ══════════════════════ */
    #page1{z-index:10;display:flex;align-items:center;justify-content:center}

    .card{
      position:relative;z-index:10;
      background:linear-gradient(150deg,#16162a,#0e0e1c);
      border:1px solid rgba(180,0,255,.4);border-radius:30px;
      padding:52px 44px 44px;max-width:500px;width:92vw;text-align:center;
      box-shadow:0 0 60px rgba(180,0,255,.2),0 0 120px rgba(255,45,120,.07),
                 inset 0 1px 0 rgba(255,255,255,.07);
      animation:cardIn .9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(55px) scale(.93)}to{opacity:1;transform:none}}
    .br{position:absolute;width:22px;height:22px;border-style:solid}
    .br.tl{top:-1px;left:-1px;border-color:var(--pink);border-width:2px 0 0 2px;border-radius:9px 0 0 0}
    .br.tr{top:-1px;right:-1px;border-color:var(--cyan);border-width:2px 2px 0 0;border-radius:0 9px 0 0}
    .br.bl{bottom:-1px;left:-1px;border-color:var(--cyan);border-width:0 0 2px 2px;border-radius:0 0 0 9px}
    .br.br2{bottom:-1px;right:-1px;border-color:var(--pink);border-width:0 2px 2px 0;border-radius:0 0 9px 0}

    .hearts-ring{position:relative;width:140px;height:140px;margin:0 auto 26px}
    .center-heart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-size:56px;filter:drop-shadow(0 0 18px var(--pink));animation:hb 1.4s ease-in-out infinite}
    @keyframes hb{0%,100%{transform:scale(1)}14%{transform:scale(1.25)}28%{transform:scale(1)}42%{transform:scale(1.15)}}
    .orb{position:absolute;inset:0}
    .orb.o1{animation:spin 5s linear infinite}
    .orb.o2{animation:spin 9s linear infinite reverse}
    .orb span{position:absolute;top:50%;left:50%;transform-origin:0 0}
    .orb.o1 span{font-size:19px}
    .orb.o2 span{font-size:13px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .p1title{
      font-family:'Orbitron',sans-serif;
      font-size:clamp(1.2rem,4.5vw,1.65rem);
      font-weight:900;letter-spacing:.14em;color:#fff;
      text-shadow:0 0 28px rgba(180,0,255,.8),0 0 8px rgba(255,45,120,.4);
      margin-bottom:6px;position:relative;
    }
    .p1title::before,.p1title::after{content:attr(data-t);position:absolute;top:0;left:0;width:100%;
      font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;pointer-events:none}
    .p1title::before{color:var(--cyan);clip-path:inset(0 0 55% 0);animation:gl1 4s infinite}
    .p1title::after {color:var(--pink);clip-path:inset(55% 0 0 0);animation:gl2 4s infinite}
    @keyframes gl1{0%,93%,100%{transform:none;opacity:0}95%{transform:translate(-3px,-1px);opacity:.5}97%{transform:translate(2px,1px);opacity:.5}}
    @keyframes gl2{0%,93%,100%{transform:none;opacity:0}96%{transform:translate(3px,-1px);opacity:.5}98%{transform:translate(-2px,1px);opacity:.5}}
    .p1sub{font-size:.87rem;color:rgba(255,255,255,.3);letter-spacing:.07em;margin-bottom:12px}
    .divider{width:75%;height:1px;background:linear-gradient(90deg,transparent,var(--purple),var(--pink),var(--cyan),transparent);margin:0 auto 34px;opacity:.5}

    /* ── buttons ── */
    .btn{
      position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:15px 44px;font-family:'Orbitron',sans-serif;font-size:.88rem;font-weight:700;letter-spacing:.1em;
      color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));
      border:none;border-radius:50px;cursor:pointer;overflow:hidden;
      box-shadow:0 0 28px rgba(255,45,120,.55),0 0 60px rgba(180,0,255,.28);
      transition:transform .15s,box-shadow .15s;user-select:none;
    }
    .btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);border-radius:inherit;pointer-events:none}
    .btn::after{content:'';position:absolute;top:-50%;left:-60%;width:60%;height:200%;background:rgba(255,255,255,.2);transform:skewX(-20deg) translateX(-100%);transition:transform .55s;pointer-events:none}
    .btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 0 44px rgba(255,45,120,.8),0 0 90px rgba(180,0,255,.5)}
    .btn:hover::after{transform:skewX(-20deg) translateX(320%)}
    .btn:active{transform:scale(.97)}
    .btn-cyan{background:transparent;border:2px solid var(--cyan);color:var(--cyan);
      box-shadow:0 0 22px rgba(0,240,255,.3)}
    .btn-cyan:hover{background:rgba(0,240,255,.08);box-shadow:0 0 44px rgba(0,240,255,.65);color:#fff;border-color:#fff}
    .btn-gold{background:linear-gradient(135deg,#ff8800,#ffd700);color:#000;
      box-shadow:0 0 28px rgba(255,190,0,.6),0 0 60px rgba(255,130,0,.3)}
    .btn-gold:hover{box-shadow:0 0 50px rgba(255,200,0,.9),0 0 100px rgba(255,130,0,.5)}
    .status-row{margin-top:28px;display:flex;align-items:center;justify-content:center;
      gap:8px;font-size:.77rem;color:rgba(255,255,255,.24);letter-spacing:.08em}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);
      box-shadow:0 0 9px var(--pink);animation:blink 1.8s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}

    /* ripple */
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);
      transform:scale(0);animation:rip .65s linear forwards;pointer-events:none}
    @keyframes rip{to{transform:scale(5);opacity:0}}

    /* ══════════════════════
       PAGE 2
    ══════════════════════ */
    #page2{z-index:20;display:flex;flex-direction:column;overflow:hidden}

    /* ── ALWAYS-VISIBLE status banner ── */
    .p2-banner{
      position:relative;z-index:30;
      flex-shrink:0;
      width:100%;
      padding:18px 20px 14px;
      text-align:center;
      background:linear-gradient(180deg,rgba(7,7,14,1) 70%,rgba(7,7,14,0));
    }
    .p2-banner-main{
      font-family:'Orbitron',sans-serif;
      font-size:clamp(.85rem,3.5vw,1.5rem);
      font-weight:900;letter-spacing:.07em;
      background:linear-gradient(90deg,
        #ff0000,#ff7700,#ffdd00,#00ff88,#00ccff,#aa00ff,#ff0088,
        #ff0000,#ff7700,#ffdd00,#00ff88,#00ccff,#aa00ff,#ff0088);
      background-size:400%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:rainbow 3.5s linear infinite;
      filter:drop-shadow(0 0 8px rgba(255,100,200,.5));
    }
    @keyframes rainbow{0%{background-position:0% center}100%{background-position:400% center}}
    @keyframes shimmer{to{background-position:300% center}}
    .p2-banner-sub{
      font-family:'Dancing Script',cursive;
      font-size:clamp(.75rem,2.2vw,1.1rem);
      color:rgba(255,255,255,.42);
      margin-top:3px;
    }
    .wc{display:inline-block;animation:wv .65s ease-in-out infinite}
    @keyframes wv{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    /* ── scrollable body ── */
    .p2-body{
      flex:1;overflow-y:auto;overflow-x:hidden;
      display:flex;flex-direction:column;align-items:center;
      gap:18px;padding:8px 16px 30px;
    }
    .p2-body::-webkit-scrollbar{width:4px}
    .p2-body::-webkit-scrollbar-track{background:transparent}
    .p2-body::-webkit-scrollbar-thumb{background:rgba(180,0,255,.4);border-radius:4px}

    .back-btn{
      position:fixed;top:14px;left:14px;
      padding:8px 20px;font-family:'Orbitron',sans-serif;font-size:.67rem;font-weight:700;letter-spacing:.1em;
      color:rgba(255,255,255,.45);background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.14);border-radius:50px;cursor:pointer;
      transition:all .2s;z-index:100;
    }
    .back-btn:hover{color:#fff;background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.3)}

    /* ══════════════════════
       KISS SCENE
    ══════════════════════ */
    .kiss-scene{
      position:relative;
      width:min(580px,94vw);
      height:clamp(200px,34vw,300px);
      border-radius:22px;overflow:hidden;
      border:1px solid rgba(255,45,120,.35);
      box-shadow:0 0 50px rgba(255,45,120,.22),0 0 100px rgba(180,0,255,.1);
      flex-shrink:0;
    }
    /* photo bg */
    .kiss-bg{
      position:absolute;inset:0;
      background-image:url('assets/images/kiss.jpg');
      background-size:cover;background-position:center 35%;
      filter:brightness(.5) contrast(1.2) grayscale(.1) saturate(1.2);
    }
    .kiss-bg::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 60%,#3d0028,#1a0018 45%,#07070e 100%);
      z-index:0;
    }
    .kiss-overlay{
      position:absolute;inset:0;
      background:linear-gradient(to bottom,rgba(7,7,14,.25) 0%,transparent 25%,transparent 75%,rgba(7,7,14,.55) 100%),
                 radial-gradient(ellipse 80% 80% at 50% 50%,transparent 35%,rgba(7,7,14,.45) 100%);
    }
    .kiss-spotlight{
      position:absolute;inset:0;
      background:radial-gradient(ellipse 55% 60% at 50% 52%,rgba(255,45,120,.12),rgba(180,0,255,.05) 55%,transparent);
      animation:spPulse 2.5s ease-in-out infinite;
    }
    @keyframes spPulse{0%,100%{opacity:1}50%{opacity:.35}}

    .svg-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    .kiss-svg{width:80%;max-width:440px;overflow:visible}

    /* ── KISS ANIMATION: 5s loop
       0–5%: rest apart
       5–32%: lean in
       32–65%: kissing (eyes closed, hearts, kiss mark)
       65–80%: pull back
       80–100%: rest apart
    ── */
    #guyL{
      animation:leanL 5s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:right center;
    }
    #guyR{
      animation:leanR 5s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:left center;
    }
    @keyframes leanL{
      0%,5%,80%,100%{transform:translateX(0) rotate(0deg)}
      32%,65%       {transform:translateX(22px) rotate(7deg)}
    }
    @keyframes leanR{
      0%,5%,80%,100%{transform:translateX(0) rotate(0deg)}
      32%,65%       {transform:translateX(-22px) rotate(-7deg)}
    }

    /* eyes: open during rest, closed during kiss */
    .eye-open{animation:eyeOC 5s ease-in-out infinite}
    @keyframes eyeOC{0%,26%,72%,100%{opacity:1}32%,65%{opacity:0}}

    .eye-closed{animation:eyeCO 5s ease-in-out infinite;opacity:0}
    @keyframes eyeCO{0%,26%,72%,100%{opacity:0}32%,65%{opacity:1}}

    /* kiss mark appears during kiss */
    #kissmark{animation:kmAnim 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes kmAnim{0%,24%,74%,100%{opacity:0;transform:scale(.1)}33%,62%{opacity:1;transform:scale(1)}}

    /* hearts during kiss */
    .kh{animation:khAnim 5s ease-in-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
    @keyframes khAnim{
      0%,30%{opacity:0;transform:translateY(0) scale(.4)}
      40%{opacity:1;transform:translateY(-14px) scale(1.1)}
      63%{opacity:.7;transform:translateY(-38px) scale(.7)}
      73%,100%{opacity:0;transform:translateY(-55px) scale(.2)}
    }

    /* sweat drop on "normal" side when cheeks flush */
    .flush{animation:flushAnim 5s ease-in-out infinite;opacity:0}
    @keyframes flushAnim{0%,28%,72%,100%{opacity:0}35%,62%{opacity:1}}

    /* burst hearts */
    .hburst{position:absolute;inset:0;pointer-events:none}
    .hburst span{position:absolute;top:50%;left:50%;font-size:clamp(.8rem,1.8vw,1.3rem);
      pointer-events:none;animation:hbo 3s ease-out infinite;opacity:0}
    @keyframes hbo{
      0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
      12%{opacity:1}
      100%{transform:translate(var(--tx),var(--ty)) scale(.05);opacity:0}
    }

    /* ══════════════════════
       NAME SECTION
    ══════════════════════ */
    .name-section{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:520px}

    .bubble{
      display:none;position:relative;
      background:linear-gradient(140deg,#200038,#0c001e);
      border:1px solid var(--purple);border-radius:22px;
      padding:16px 36px;
      font-family:'Dancing Script',cursive;
      font-size:clamp(1.2rem,4.5vw,2rem);
      color:var(--pink);text-shadow:0 0 18px rgba(255,45,120,.6);
      box-shadow:0 0 42px rgba(180,0,255,.4);
      text-align:center;animation:bPop .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    .bubble.show{display:block}
    @keyframes bPop{from{opacity:0;transform:scale(.35) rotate(-5deg)}to{opacity:1;transform:none}}
    .bubble::before{content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.07),transparent);border-radius:inherit;pointer-events:none}
    .bubble::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
      border:10px solid transparent;border-top-color:var(--purple);border-bottom:0}

    /* mun name */
    .mun-reveal{
      display:none;flex-direction:column;align-items:center;gap:8px;
      animation:munIn .8s cubic-bezier(.34,1.56,.64,1) both;
    }
    .mun-reveal.show{display:flex}
    @keyframes munIn{from{opacity:0;transform:scale(.25) rotate(10deg)}to{opacity:1;transform:none}}
    .mun-name{
      font-family:'Dancing Script',cursive;
      font-size:clamp(3rem,14vw,6rem);
      font-weight:700;
      background:linear-gradient(135deg,var(--pink),#ff9cf4,var(--gold),var(--pink));
      background-size:250%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:shimmer 2s linear infinite, munFloat 2s ease-in-out infinite;
      filter:drop-shadow(0 0 24px rgba(255,45,120,.7));
      line-height:1.1;
    }
    @keyframes munFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
    .mun-sub{font-family:'Dancing Script',cursive;font-size:clamp(.85rem,2.5vw,1.2rem);color:rgba(255,255,255,.45)}
    .mun-hearts{font-size:1.5rem;animation:hb 1.2s ease-in-out infinite;letter-spacing:8px}

    /* ── BLAST FX ── */
    .blast-ring{
      position:fixed;border-radius:50%;pointer-events:none;z-index:800;
      transform:translate(-50%,-50%) scale(1);
      animation:ringOut .9s ease-out forwards;
    }
    @keyframes ringOut{
      0%  {transform:translate(-50%,-50%) scale(1);opacity:1}
      100%{transform:translate(-50%,-50%) scale(55);opacity:0}
    }
    .blast-flash{
      position:fixed;inset:0;pointer-events:none;z-index:790;
      animation:flashFade .5s ease-out forwards;
    }
    @keyframes flashFade{0%{opacity:1}100%{opacity:0}}
    .blast-emoji{
      position:fixed;pointer-events:none;z-index:810;font-size:1.4rem;
      animation:emB ease-out forwards;
    }
    @keyframes emB{
      0%  {opacity:1;transform:translate(-50%,-50%) scale(1.2)}
      100%{opacity:0;transform:translate(calc(-50% + var(--ex)),calc(-50% + var(--ey))) scale(.1)}
    }
    .cp{position:fixed;pointer-events:none;z-index:810;width:8px;height:8px;
      animation:cpFall linear forwards;border-radius:1px}
    @keyframes cpFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(108vh) rotate(700deg)}}
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="grid"></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="floaters"></div>

<!-- ══════════ PAGE 1 ══════════ -->
<div id="page1" class="page visible">
  <div class="card">
    <span class="br tl"></span><span class="br tr"></span>
    <span class="br bl"></span><span class="br br2"></span>

    <div class="hearts-ring">
      <div class="center-heart">❤️</div>
      <div class="orb o1">
        <span style="transform:rotate(0deg) translateY(-62px)">💜</span>
        <span style="transform:rotate(90deg) translateY(-62px)">💗</span>
        <span style="transform:rotate(180deg) translateY(-62px)">💙</span>
        <span style="transform:rotate(270deg) translateY(-62px)">💛</span>
      </div>
      <div class="orb o2">
        <span style="transform:rotate(45deg) translateY(-48px)">✨</span>
        <span style="transform:rotate(135deg) translateY(-48px)">🌸</span>
        <span style="transform:rotate(225deg) translateY(-48px)">✨</span>
        <span style="transform:rotate(315deg) translateY(-48px)">🌸</span>
      </div>
    </div>

    <div class="p1title" data-t="SHADIKIN BHAI">SHADIKIN BHAI</div>
    <div class="p1sub">◈ RELATIONSHIP STATUS SYSTEM v2.0 ◈</div>
    <div class="divider"></div>
    <button class="btn" id="btnCheck" onclick="goPage2(event)">❤️ CHECK STATUS</button>
    <div class="status-row">
      <span class="dot"></span>
      LOVE SIGNAL DETECTED &nbsp;•&nbsp; SYSTEM ACTIVE
    </div>
  </div>
</div>

<!-- ══════════ PAGE 2 ══════════ -->
<div id="page2" class="page hidden">
  <button class="back-btn" onclick="goBack()">← BACK</button>

  <!-- ALWAYS VISIBLE BANNER -->
  <div class="p2-banner">
    <div class="p2-banner-main" id="bannerText">Shadikin Bhai is Taken</div>
    <div class="p2-banner-sub">💍 Officially Taken — No Vacancy 💍</div>
  </div>

  <!-- SCROLLABLE CONTENT -->
  <div class="p2-body">

    <!-- KISS SCENE -->
    <div class="kiss-scene">
      <div class="kiss-bg"></div>
      <div class="kiss-overlay"></div>
      <div class="kiss-spotlight"></div>

      <div class="svg-center">
        <!--
          Two cartoon guys with mustaches kissing.
          ViewBox: 0 0 500 260
          Guy Left (pink/purple) centered ~x=125
          Guy Right (cyan/purple) centered ~x=375
          They lean toward each other and kiss at center (~x=250)
        -->
        <svg class="kiss-svg" viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg" overflow="visible">
          <defs>
            <!-- Left guy gradient: pink→purple -->
            <linearGradient id="gL1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff2d78"/>
              <stop offset="100%" stop-color="#c000ee"/>
            </linearGradient>
            <!-- Left guy hair/dark -->
            <linearGradient id="gL2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2d0040"/>
              <stop offset="100%" stop-color="#1a0028"/>
            </linearGradient>
            <!-- Right guy gradient: cyan→purple -->
            <linearGradient id="gR1" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#00e0ff"/>
              <stop offset="100%" stop-color="#8800ff"/>
            </linearGradient>
            <!-- Right guy hair/dark -->
            <linearGradient id="gR2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#002d40"/>
              <stop offset="100%" stop-color="#001a28"/>
            </linearGradient>
            <!-- skin tone: warm peachy -->
            <linearGradient id="skinL" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f9c8a0"/>
              <stop offset="100%" stop-color="#e8a070"/>
            </linearGradient>
            <linearGradient id="skinR" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f7c5b0"/>
              <stop offset="100%" stop-color="#e09070"/>
            </linearGradient>
            <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="gwSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

<script>
/* ══ PARTICLES ══ */
const cv=document.getElementById('bg-canvas'),cx=cv.getContext('2d');
const PC=['#ff2d78','#b400ff','#00f0ff','#ff80ab','#ea00ff','#ffd700'];
let W,H,pts=[];
function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight}
rsz();window.addEventListener('resize',rsz);
function mkP(pre){
  const p={};
  p.reset=function(){p.x=Math.random()*W;p.y=H+10;p.r=Math.random()*4+1;p.col=PC[Math.random()*PC.length|0];
    p.sp=Math.random()*.7+.25;p.dr=(Math.random()-.5)*.5;p.a=0;p.fi=Math.random()*.018+.004;p.l=0;p.ml=Math.random()*220+140};
  p.reset();if(pre){p.y=Math.random()*H;p.l=Math.random()*p.ml;p.a=Math.random()*.65}
  return p;
}
pts=Array.from({length:110},()=>mkP(true));
(function loop(){
  cx.clearRect(0,0,W,H);
  for(const p of pts){
    p.y-=p.sp;p.x+=p.dr;p.l++;
    if(p.l<p.ml*.3)p.a=Math.min(p.a+p.fi,.7);else p.a=Math.max(p.a-p.fi*.5,0);
    if(p.l>p.ml||p.y<-10)p.reset();
    cx.save();cx.globalAlpha=p.a;cx.fillStyle=p.col;cx.shadowBlur=10;cx.shadowColor=p.col;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();cx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ══ FLOATERS ══ */
const FE=['❤️','💜','💗','💍','💋','✨','🌸','💘','💝'];
const fcon=document.getElementById('floaters');
const _ks=document.createElement('style');
_ks.textContent='@keyframes fUp{from{transform:translateY(0) rotate(0deg);opacity:.5}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}';
document.head.appendChild(_ks);
function spawnF(){
  const el=document.createElement('div');
  el.textContent=FE[Math.random()*FE.length|0];
  el.style.cssText='position:fixed;left:'+Math.random()*100+'vw;bottom:-40px;font-size:'+(Math.random()*16+9)+'px;pointer-events:none;z-index:3;opacity:.5;animation:fUp '+(Math.random()*5+4)+'s ease-out forwards';
  fcon.appendChild(el);el.addEventListener('animationend',()=>el.remove());
}
setInterval(spawnF,550);

/* ══ RIPPLE ══ */
function ripple(btn,e){
  const r=btn.getBoundingClientRect(),rp=document.createElement('span');
  rp.className='ripple';
  const sz=Math.max(r.width,r.height);
  rp.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px';
  btn.appendChild(rp);rp.addEventListener('animationend',()=>rp.remove());
}

/* ══ BLAST ══ */
function blast(e){
  const ox=e.clientX,oy=e.clientY;
  const RC=['#ff2d78','#b400ff','#00f0ff'];
  RC.forEach((col,i)=>{
    const r=document.createElement('div');r.className='blast-ring';
    r.style.cssText='left:'+ox+'px;top:'+oy+'px;width:18px;height:18px;border:3px solid '+col+';animation-delay:'+(i*.1)+'s';
    document.body.appendChild(r);r.addEventListener('animationend',()=>r.remove());
  });
  const fl=document.createElement('div');fl.className='blast-flash';
  fl.style.background='radial-gradient(circle at '+ox+'px '+oy+'px,rgba(255,255,255,.16),rgba(255,45,120,.07) 35%,transparent 65%)';
  document.body.appendChild(fl);fl.addEventListener('animationend',()=>fl.remove());
  const EM=['❤️','💜','💗','💋','✨','🌸','💘','💝','🔓','🎉','🥳','💯','🌹','💞','😍','🔥'];
  for(let i=0;i<24;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='blast-emoji';
      el.textContent=EM[Math.random()*EM.length|0];
      const a=Math.random()*Math.PI*2,d=Math.random()*240+90;
      el.style.cssText='left:'+ox+'px;top:'+oy+'px;--ex:'+Math.cos(a)*d+'px;--ey:'+Math.sin(a)*d+'px;animation-duration:'+(Math.random()*.7+.8)+'s;animation-delay:'+(Math.random()*.15)+'s';
      document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
    },i*18);
  }
  const CC=['#ff2d78','#b400ff','#00f0ff','#ffd700','#ff80ab','#00ff88','#fff'];
  for(let i=0;i<90;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='cp';
      el.style.cssText='left:'+(ox+(Math.random()*120-60))+'px;top:'+oy+'px;background:'+CC[Math.random()*CC.length|0]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+(Math.random()*2+1.5)+'s;animation-delay:'+(Math.random()*.5)+'s';
      document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
    },i*18);
  }
}

/* ══ HEART BURST SCENE ══ */
function buildBurst(){
  const w=document.getElementById('hburst');w.innerHTML='';
  const H2=['❤️','💜','💗','💋','✨','🌸','💘','💝','🌹'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.textContent=H2[i%H2.length];
    const a=(i/14)*Math.PI*2,d=Math.random()*90+50;
    s.style.setProperty('--tx',Math.cos(a)*d+'px');
    s.style.setProperty('--ty',Math.sin(a)*d-55+'px');
    s.style.animationDelay=i*.2+'s';s.style.animationDuration=(Math.random()+2.4)+'s';
    w.appendChild(s);
  }
}

/* ══ WAVE TEXT ══ */
function waveEl(el){
  const t=el.textContent;
  el.innerHTML=t.split('').map((c,i)=>
    c===' '?'<span style="display:inline-block">&nbsp;</span>':
    '<span class="wc" style="animation-delay:'+(i*.065)+'s">'+c+'</span>'
  ).join('');
}

/* ══ PAGE TRANSITIONS ══ */
function goPage2(e){
  ripple(document.getElementById('btnCheck'),e);
  const CC=['#ff2d78','#b400ff','#00f0ff','#ffd700','#ff80ab'];
  for(let i=0;i<70;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='cp';
      el.style.cssText='left:'+Math.random()*100+'vw;top:0;background:'+CC[Math.random()*CC.length|0]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+(Math.random()*2+1.5)+'s;animation-delay:'+(Math.random()*.4)+'s';
      document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
    },i*22);
  }
  buildBurst();
  document.getElementById('page1').classList.replace('visible','hidden');
  document.getElementById('page2').classList.replace('hidden','visible');
  setTimeout(()=>waveEl(document.getElementById('bannerText')),400);
  resetName();
}

function goBack(){
  document.getElementById('page2').classList.replace('visible','hidden');
  document.getElementById('page1').classList.replace('hidden','visible');
}

/* ══ NAME STATE MACHINE ══ */
function resetName(){
  document.getElementById('bubble1').classList.remove('show');
  document.getElementById('btnBol').style.display='none';
  document.getElementById('munReveal').classList.remove('show');
  document.getElementById('lockIco').textContent='🔒';
  document.getElementById('btnRevealTxt').textContent="REVEAL GIRL'S NAME";
  const br=document.getElementById('btnReveal');
  br.style.display='';
  br.onclick=function(ev){step1(ev)};
}

function step1(e){
  ripple(document.getElementById('btnReveal'),e);
  const b1=document.getElementById('bubble1');
  b1.classList.add('show');
  b1.style.animation='none';void b1.offsetWidth;b1.style.animation='bPop .6s cubic-bezier(.34,1.56,.64,1) both';
  document.getElementById('lockIco').textContent='🤫';
  document.getElementById('btnRevealTxt').textContent='HIDE';
  setTimeout(()=>{
    const bb=document.getElementById('btnBol');
    bb.style.display='inline-flex';
    bb.style.animation='none';void bb.offsetWidth;bb.style.animation='bPop .5s cubic-bezier(.34,1.56,.64,1) both';
  },500);
  document.getElementById('btnReveal').onclick=function(ev){
    ripple(this,ev);resetName();
  };
}

function step2(e){
  blast(e);
  ripple(document.getElementById('btnBol'),e);
  document.getElementById('btnBol').style.display='none';
  document.getElementById('btnReveal').style.display='none';
  document.getElementById('bubble1').classList.remove('show');
  setTimeout(()=>{
    const mr=document.getElementById('munReveal');
    mr.classList.add('show');
    mr.style.animation='none';void mr.offsetWidth;mr.style.animation='munIn .8s cubic-bezier(.34,1.56,.64,1) both';
  },320);
}
</script>
