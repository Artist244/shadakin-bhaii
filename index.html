<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shadikin Bhai</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #ff2d78;
      --purple: #b400ff;
      --cyan:   #00f0ff;
      --dark:   #0a0a0f;
      --card:   #12121c;
    }

    body {
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ── animated background particles ── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ── grid lines ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(180,0,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,0,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 10;
      background: var(--card);
      border: 1px solid rgba(180,0,255,.3);
      border-radius: 24px;
      padding: 60px 50px 50px;
      max-width: 560px;
      width: 90vw;
      text-align: center;
      box-shadow:
        0 0 40px rgba(180,0,255,.15),
        0 0 80px rgba(255,45,120,.08),
        inset 0 1px 0 rgba(255,255,255,.05);
      animation: cardIn .8s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(40px) scale(.96); }
      to   { opacity:1; transform:none; }
    }

    /* corner accents */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      border-color: var(--pink);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px;  border-width: 2px 0 0 2px; border-radius: 8px 0 0 0; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 8px 0; }

    /* ── hearts ring ── */
    .hearts-ring {
      position: relative;
      width: 120px; height: 120px;
      margin: 0 auto 32px;
    }
    .heart-icon {
      font-size: 52px;
      line-height: 1;
      filter: drop-shadow(0 0 14px var(--pink));
      animation: heartbeat 1.4s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      14%     { transform: scale(1.18); }
      28%     { transform: scale(1); }
      42%     { transform: scale(1.12); }
    }
    .orbit {
      position: absolute;
      inset: 0;
      animation: spin 6s linear infinite;
    }
    .orbit span {
      position: absolute;
      font-size: 16px;
      top: 50%; left: 50%;
      transform-origin: 0 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── title ── */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 900;
      letter-spacing: .12em;
      color: #fff;
      text-shadow: 0 0 20px rgba(180,0,255,.6);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: .95rem;
      color: rgba(255,255,255,.35);
      letter-spacing: .06em;
      margin-bottom: 44px;
    }

    /* ── button ── */
    .btn {
      position: relative;
      display: inline-block;
      padding: 16px 44px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .1em;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      border-radius: 50px;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 0 24px rgba(255,45,120,.5),
        0 0 60px rgba(180,0,255,.25);
      transition: transform .15s, box-shadow .15s;
      user-select: none;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
      border-radius: inherit;
    }
    .btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -60%;
      width: 60%; height: 200%;
      background: rgba(255,255,255,.18);
      transform: skewX(-20deg) translateX(-100%);
      transition: transform .5s;
    }
    .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 40px rgba(255,45,120,.7), 0 0 80px rgba(180,0,255,.4); }
    .btn:hover::after { transform: skewX(-20deg) translateX(320%); }
    .btn:active { transform: scale(.97); }

    /* ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
      transform: scale(0);
      animation: rippleOut .6s linear;
      pointer-events: none;
    }
    @keyframes rippleOut { to { transform: scale(4); opacity: 0; } }

    /* ── result banner ── */
    .result {
      margin-top: 36px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-text {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .result-text.show { display: flex; }
    @keyframes popIn {
      from { opacity:0; transform:scale(.6); }
      to   { opacity:1; transform:scale(1); }
    }
    .result-main {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      font-weight: 900;
      background: linear-gradient(90deg, var(--pink), var(--cyan), var(--purple));
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 2.5s linear infinite;
      text-shadow: none;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .result-emoji { font-size: 2rem; animation: bounce 1s ease infinite; }
    @keyframes bounce {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-8px); }
    }

    /* ── status dot ── */
    .status-row {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: .8rem;
      color: rgba(255,255,255,.3);
      letter-spacing: .08em;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 8px var(--pink);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.4; transform:scale(.7); }
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="card">

  <div class="hearts-ring">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;">
      <span class="heart-icon">❤️</span>
    </div>
    <div class="orbit">
      <span style="transform:rotate(0deg) translateY(-54px)">💜</span>
      <span style="transform:rotate(90deg) translateY(-54px)">💗</span>
      <span style="transform:rotate(180deg) translateY(-54px)">💙</span>
      <span style="transform:rotate(270deg) translateY(-54px)">💛</span>
    </div>
  </div>

  <div class="title">SHADIKIN BHAI</div>
  <div class="subtitle">STATUS CHECKER v1.0</div>

  <button class="btn" id="btn" onclick="reveal(event)">
    CHECK STATUS
  </button>

  <div class="result">
    <div class="result-text" id="result">
      <span class="result-emoji">💍</span>
      <span class="result-main">Shadikin Bhai is in Relationship</span>
      <span class="result-emoji">💑</span>
    </div>
  </div>

  <div class="status-row">
    <span class="dot"></span>
    SYSTEM ONLINE
  </div>

</div>

<script>
  /* ── particles ── */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#ff2d78','#b400ff','#00f0ff','#ff80ab','#ea00ff'];
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); spawnAll(); });

  function Particle() {
    this.reset = function() {
      this.x = Math.random() * W;
      this.y = H + 10;
      this.r = Math.random() * 4 + 1;
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.speed = Math.random() * .6 + .3;
      this.drift = (Math.random() - .5) * .4;
      this.alpha = 0;
      this.fadeIn = Math.random() * .02 + .005;
      this.life = 0;
      this.maxLife = Math.random() * 200 + 150;
    };
    this.reset();
    this.y = Math.random() * H;
    this.life = Math.random() * this.maxLife;
    this.alpha = Math.random() * .7;
  }

  function spawnAll() {
    particles = Array.from({length: 80}, () => new Particle());
  }
  spawnAll();

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.y -= p.speed;
      p.x += p.drift;
      p.life++;
      if (p.life < p.maxLife * .3) p.alpha = Math.min(p.alpha + p.fadeIn, .7);
      else p.alpha = Math.max(p.alpha - p.fadeIn * .5, 0);
      if (p.life > p.maxLife || p.y < -10) p.reset();
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  /* ── button ── */
  let revealed = false;
  function reveal(e) {
    /* ripple */
    const btn = document.getElementById('btn');
    const rect = btn.getBoundingClientRect();
    const rip = document.createElement('span');
    rip.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(rip);
    rip.addEventListener('animationend', () => rip.remove());

    /* show result */
    revealed = !revealed;
    const res = document.getElementById('result');
    if (revealed) {
      res.classList.add('show');
      btn.textContent = 'HIDE STATUS';
      launchHearts();
    } else {
      res.classList.remove('show');
      btn.textContent = 'CHECK STATUS';
    }
  }

  /* burst hearts on reveal */
  function launchHearts() {
    const emojis = ['❤️','💜','💗','💍','💑','✨'];
    for (let i = 0; i < 18; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.cssText = `
          position:fixed;
          left:${Math.random()*100}vw;
          bottom:0;
          font-size:${Math.random()*20+14}px;
          pointer-events:none;
          z-index:999;
          animation:floatUp ${Math.random()*1.5+1.5}s ease-out forwards;
        `;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }, i * 60);
    }
  }

  /* inject floatUp keyframe */
  const style = document.createElement('style');
  style.textContent = `@keyframes floatUp{from{transform:translateY(0) scale(1);opacity:1}to{transform:translateY(-90vh) scale(.4);opacity:0}}`;
  document.head.appendChild(style);
</script>
</body>
</html>
